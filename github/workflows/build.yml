name: Build Android APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumen-android
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        working-directory: .
        run: unzip -q lumen-android.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
      - working-directory: lumen-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-debug-apk
          path: lumen-android/android/app/build/outputs/apk/debug/app-debug.apk
